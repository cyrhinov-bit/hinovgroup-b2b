services:
  - type: web
    name: hinov-business-suite
    env: static
    buildCommand: npm install --include=optional --legacy-peer-deps --include=dev && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
